<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — FoodMan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F8F9FA;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      max-width: 440px;
      width: 100%;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      border: 1px solid #E2E8F0;
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      background: #FFF1F2;
      border: 2px solid #FFE4E6;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      color: #E11D48;
    }
    .icon-wrap svg {
      width: 40px;
      height: 40px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #64748B;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: #E11D48;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #BE123C;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status-msg {
      margin-top: 14px;
      font-size: 12px;
      color: #94A3B8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <!-- Wifi Off Icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Currently Offline</h1>
    <p>Please connect to Wi-Fi or mobile data to explore restaurants, view live menus, and place orders on FoodMan.</p>
    
    <button class="btn" id="refreshBtn" onclick="handleRefresh()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"></path>
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
        <path d="M3 22v-6h6"></path>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
      </svg>
      Refresh to Reconnect
    </button>
    <div class="status-msg" id="statusMsg">Checking internet connection...</div>
  </div>

  <script>
    function updateStatus() {
      const msg = document.getElementById('statusMsg');
      if (navigator.onLine) {
        msg.textContent = 'Connection restored! Refreshing...';
        msg.style.color = '#16A34A';
        setTimeout(() => window.location.href = '/', 1000);
      } else {
        msg.textContent = 'No internet connection detected.';
        msg.style.color = '#E11D48';
      }
    }

    function handleRefresh() {
      const msg = document.getElementById('statusMsg');
      msg.textContent = 'Checking network...';
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          msg.textContent = 'Still offline. Please check your Wi-Fi or cellular network.';
        }, 400);
      }
    }

    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    updateStatus();
  </script>
</body>
</html>
